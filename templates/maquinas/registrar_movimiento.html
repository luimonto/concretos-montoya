<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Movimiento {{ maquina.asset_code }} | Concretos Montoya
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f5f7;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .company {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .asset-code {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
        }

        .machine {
            background: #f9fafb;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 24px;
        }

        .machine-name {
            font-size: 18px;
            font-weight: bold;
        }

        .machine-code {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: white;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="company">
            CONCRETOS MONTOYA
        </div>

        <div class="asset-code">
            {{ maquina.asset_code }}
        </div>

        <h1>
            Registrar movimiento
        </h1>


        <div class="machine">

            <div class="machine-name">
                {{ maquina.equipment_type.name }}
            </div>

            <div class="machine-code">
                {{ maquina }}
            </div>

        </div>


        <form method="post">

            {% csrf_token %}


            <div class="field">

                <label for="movement_type">
                    Tipo de movimiento
                </label>

                <select
                    name="condition_out"
                    id="condition_out"
                >
                    <option value="">
                        Selecciona condición
                    </option>

                    {% for value, label in movement_types %}
                        <option value="{{ value }}">
                            {{ label }}
                        </option>
                    {% endfor %}
                </select>

            </div>


            <div class="field">

                <label for="origin">
                    Ubicación origen
                </label>

                <select
                    name="origin"
                    id="origin"
                >
                    <option value="">
                        Selecciona ubicación
                    </option>

                    {% for location in locations %}
                        <option value="{{ location.id }}">
                            {{ location.name }}
                        </option>
                    {% endfor %}

                </select>

            </div>


            <div class="field">

                <label for="destination">
                    Ubicación destino
                </label>

                <select
                    name="destination"
                    id="destination"
                >
                    <option value="">
                        Selecciona ubicación
                    </option>

                    {% for location in locations %}
                        <option value="{{ location.id }}">
                            {{ location.name }}
                        </option>
                    {% endfor %}

                </select>

            </div>


            <div class="field">

                <label for="project">
                    Proyecto / Obra
                </label>

                <select
                    name="project"
                    id="project"
                >
                    <option value="">
                        Selecciona proyecto
                    </option>

                    {% for project in projects %}
                        <option value="{{ project.id }}">
                            {{ project }}
                        </option>
                    {% endfor %}

                </select>

            </div>


            <div class="field">

                <label for="responsible">
                    Responsable
                </label>

                <select
                    name="responsible"
                    id="responsible"
                >
                    <option value="">
                        Selecciona responsable
                    </option>

                    {% for employee in employees %}
                        <option value="{{ employee.id }}">
                            {{ employee }}
                        </option>
                    {% endfor %}

                </select>

            </div>


            <div class="field">

                <label for="condition_out">
                    Condición al salir
                </label>

                <select
                    name="condition_out"
                    id="condition_out"
                >
                    <option value="">
                        Selecciona condición
                    </option>

                    {% for value, label in conditions %}
                        <option value="{{ value }}">
                            {{ label }}
                        </option>
                    {% endfor %}

                </select>

            </div>


            <div class="field">

                <label for="notes">
                    Observaciones
                </label>

                <textarea
                    name="notes"
                    id="notes"
                    placeholder="Observaciones del movimiento..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="button"
            >
                Guardar movimiento
            </button>


            <a
                href="{% url 'detalle_maquina_qr' maquina.qr_token %}"
                class="cancel"
            >
                Cancelar
            </a>

        </form>

    </div>

</div>

</body>
</html>
